<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Versalhes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="blog">
        <header class="blog-header">
            <a href="index.html">← Voltar</a>
            <h1>Blog Versalhes</h1>
            <p>Deixe uma mensagem e veja o que outras pessoas publicaram.</p>
        </header>

        <form class="camp_user" id="mensagem-form">
            <label for="autor">Nome</label>
            <input id="autor" name="autor" type="text" minlength="2" maxlength="50" placeholder="Seu nome" required>

            <label for="conteudo">Mensagem</label>
            <textarea id="conteudo" name="conteudo" minlength="1" maxlength="1000" placeholder="Escreva sua mensagem" required></textarea>
            <button type="submit">Enviar mensagem</button>
        </form>

        <section class="mensagens-section">
            <h2>Mensagens</h2>
            <p id="blog-status" role="status"></p>
            <div id="mensagens"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
